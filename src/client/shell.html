<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>specdeck</title>
    <style>
      /*STYLES*/
    </style>
  </head>
  <body>
    <header>
      <h1>
        specdeck <small id="ver" class="muted" style="font-weight: 450; font-size: 11px"></small>
        <em id="pname"></em>
      </h1>
      <span class="chip" id="scan">scanning</span>
      <span class="chip" id="counts"></span>
      <span class="pactions" id="pactions"></span>
      <span class="grow"></span>
      <span class="seg">
        <button id="viewHome">Projects</button>
        <button id="viewBoard" class="on">Board</button>
        <button id="viewList">List</button>
        <button id="viewSpecs">Specs</button>
      </span>
      <input id="filter" placeholder="Filter" />
      <button class="icon" id="themeBtn" title="Theme"></button>
    </header>
    <div id="banners"></div>
    <div class="syncbar" id="syncbar" hidden></div>
    <div class="board" id="board"></div>
    <div class="list" id="list" hidden></div>
    <div class="specs" id="specs" hidden></div>
    <div class="setup" id="setup" hidden></div>
    <div class="home" id="home" hidden></div>
    <div id="editor"></div>
    <div id="panel"></div>
    <div id="modal"></div>
    <div id="toast"></div>

    <script>
      /*SCRIPT*/
    </script>
  </body>
</html>
