name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional here. specdeck compares working tree content
        # against committed content, and the Windows runner defaults to
        # core.autocrlf=true, which is exactly the condition that produces
        # phantom modifications if the sync layer regresses.
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The lower bound is the minimum this package claims to support. The
        # upper bound is current. A break in either is a break users will hit.
        node: ['20.19.0', '24.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sync and timeline features read git history, so tests must not run
          # against a shallow clone.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify (format, lint, types, tests)
        run: npm run verify

      - name: Build
        run: npm run build
